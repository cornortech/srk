

<!DOCTYPE html>

  <head>

      href="/team/landingImage1-1920.webp"
      imagesrcset="/team/landingImage1-640.webp 640w, /team/landingImage1-1080.webp 1080w, /team/landingImage1-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high" />

  <body>
    <div id="root"></div>
    <!--
      Static first-paint skeleton, "/" only: this app is a client-rendered SPA, so
      without this the browser has nothing to paint until the JS bundle downloads,
      parses and executes React (this is why LCP/FCP were red in PageSpeed Insights).
      Painting the real hero markup here lets FCP/LCP happen as soon as the (already
      preloaded) hero image + CSS arrive, fully decoupled from JS load time. React's
      createRoot().render() replaces #root's contents on mount, so this is swapped
      out for the real IntroSection automatically with no extra code needed.
      This is a fallback only: when built with `npm run build:university`,
      scripts/prerender-university-simple.ts already fills #root with real,
      complete prerendered content, and the guard below leaves it untouched.
    -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        var root = document.getElementById('root');
        // If this page was served pre-rendered (npm run build:university),
        // #root already has real, complete content — never overwrite it
        // with the thin skeleton below.
        if (root.children.length > 0) return;
        root.innerHTML =
          '<div class="fixed h-32 top-0 z-50 bg-black w-full border-b border-primary flex items-center px-6">' +
            '<img src="/logo/transparentLogo.webp" alt="SRK University" width="100" height="60" />' +
          '</div>' +
          '<div class="mt-32">' +
            '<section class="relative h-[500px] sm:h-[600px] md:h-[700px] xl:h-[90vh] overflow-hidden">' +
              '<img src="/team/landingImage1-1920.webp" srcset="/team/landingImage1-640.webp 640w, /team/landingImage1-1080.webp 1080w, /team/landingImage1-1920.webp 1920w" sizes="100vw" alt="Landing Image" class="absolute inset-0 w-full h-full object-cover" fetchpriority="high" />' +
              '<div class="absolute inset-0 bg-black bg-opacity-50"></div>' +
              '<div class="absolute inset-0 bg-gradient-to-r from-black via-black/25 to-black/25 opacity-60 pointer-events-none"></div>' +
              '<div class="relative z-10 w-full max-w-7xl mx-auto px-6 flex flex-col items-start justify-center h-full text-left">' +
                '<h1 class="text-white text-sm font-semibold mb-2 tracking-widest">Welcome to The SRK University</h1>' +
                '<h2 class="text-white text-3xl font-bold mb-4">THE REVOLUTION OF ENTREPRENEURSHIP</h2>' +
                '<h2 class="text-white text-xl sm:text-2xl md:text-3xl font-semibold mb-6">UNLOCK THE TOOLS TO MASTERY &amp; CONFIDENCE</h2>' +
                '<p class="text-gray-300 text-base md:text-lg mb-8 max-w-lg">The SRK University empowers entrepreneurs with hands-on guidance, expert-led training, and a thriving community&mdash;all in one place.</p>' +
                '<div class="inline-flex items-center justify-center px-10 font-semibold text-white bg-yellow-600 w-48 py-3 text-lg">Get Started Now</div>' +
                '<p class="text-gray-400 text-sm mt-4">Secure your access today and start your journey.</p>' +
              '</div>' +
            '</section>' +
          '</div>';
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
    <!--
      Google AdSense: deferred until the browser has actually recorded an LCP
      candidate, not just until window "load". AdSense's own scripts
      (adsbygoogle.js -> show_ads_impl.js, ~190KB) are heavy enough that even
      loading them right at window "load" was measurably delaying LCP by
      competing for bandwidth/main-thread time. Waiting for a real LCP entry
      first means ads never load until there's already something painted to
      compete with. Falls back to window "load" + timeout if the LCP API is
      unavailable or never fires for this page.

      Also skipped entirely when navigator.webdriver is set (the prerender
      crawl in scripts/prerender-university-simple.ts runs on Puppeteer,
      which sets this): that script waits for the page to fully settle
      before capturing HTML, so a loaded ad -- iframe, network calls tied to
      the prerender server's own localhost URL and all -- would get baked
      into the static snapshot and shipped to every real visitor as dead,
      broken markup. Skipping it here means real visitors still get ads
      loaded fresh and properly deferred on their own page load.
    -->
    <script>
      (function () {
        if (navigator.webdriver) return;
        var triggered = false;
        var trigger = function () {
          if (triggered) return;
          triggered = true;
          var loadAds = function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7145379318898250';
            s.crossOrigin = 'anonymous';
            document.head.appendChild(s);
          };
          if ('requestIdleCallback' in window) requestIdleCallback(loadAds, { timeout: 2000 });
          else setTimeout(loadAds, 500);
        };

        if ('PerformanceObserver' in window) {
          try {
            var po = new PerformanceObserver(function () {
              trigger();
            });
            po.observe({ type: 'largest-contentful-paint', buffered: true });
          } catch (e) {
            window.addEventListener('load', trigger);
          }
        } else {
          window.addEventListener('load', trigger);
        }
        // Belt-and-braces: never wait forever if LCP never fires.
        window.addEventListener('load', function () {
          setTimeout(trigger, 4000);
        });
      })();
    </script>
  </body>
</html>
